name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project & Code V6 Liquid Glass
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/ytbblocker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtbBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.ytbblocker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.ytbblocker"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 6
                  versionName = "6.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="true" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <application
                  android:label="YouTube TimeGlass"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/service_config" />
                  </service>
                  <receiver
                      android:name=".AdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/AdminReceiver.kt
          package com.example.ytbblocker
          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
                  return "Yêu cầu mật khẩu quản trị để gỡ cài đặt!"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/GlassUI.kt
          package com.example.ytbblocker

          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.util.TypedValue
          import android.view.View

          object GlassUI {
              fun dp(context: Context, value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      context.resources.displayMetrics
                  ).toInt()
              }

              // Thẻ kính mờ Liquid Glass chuẩn Apple visionOS
              fun glassCard(context: Context, cornerDp: Int = 30): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          Color.parseColor("#40FFFFFF"),
                          Color.parseColor("#18FFFFFF"),
                          Color.parseColor("#28FFFFFF")
                      )
                  ).apply {
                      cornerRadius = dp(context, cornerDp).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#66FFFFFF"))
                  }
              }

              // Ô nhập liệu kính tối bên trong
              fun glassInput(context: Context): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#38000000"))
                      cornerRadius = dp(context, 18).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#45FFFFFF"))
                  }
              }

              // Nút bấm Liquid Glass phát sáng
              fun glassButton(context: Context, isAccent: Boolean = true, isDanger: Boolean = false): GradientDrawable {
                  val colors = when {
                      isDanger -> intArrayOf(Color.parseColor("#CCFF3B30"), Color.parseColor("#99D70015"))
                      isAccent -> intArrayOf(Color.parseColor("#CC0A84FF"), Color.parseColor("#990055D4"))
                      else -> intArrayOf(Color.parseColor("#35FFFFFF"), Color.parseColor("#18FFFFFF"))
                  }
                  return GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, colors).apply {
                      cornerRadius = dp(context, 20).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#80FFFFFF"))
                  }
              }

              // Nền vũ trụ sâu thẳm kiểu iOS 18
              fun cosmicBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          Color.parseColor("#0B0F29"),
                          Color.parseColor("#1A103C"),
                          Color.parseColor("#091E26")
                      )
                  )
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/BlockerService.kt
          package com.example.ytbblocker

          import android.accessibilityservice.AccessibilityService
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class BlockerService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var isOverlayShowing = false
              private var currentLockMode = "YTB" // "YTB" hoặc "PROTECT"
              private var lastActivePkg = ""

              private fun isYoutubePkg(pkg: String): Boolean {
                  val p = pkg.lowercase(Locale.getDefault())
                  if (p == packageName.lowercase(Locale.getDefault())) return false
                  return p.contains("youtube") || p.contains("smarttube") ||
                         p.contains("vanced") || p.contains("revanced") ||
                         p.contains("newpipe") || p.contains("tubular")
              }

              private fun isInstallerPkg(pkg: String): Boolean {
                  val p = pkg.lowercase(Locale.getDefault())
                  return p.contains("packageinstaller") || p.contains("permissioncontroller") || p.contains("uninstaller")
              }

              // Kiểm tra xem người dùng có đang mở Cài đặt để tắt quyền của App hay không
              private fun isTamperingWithOurApp(root: AccessibilityNodeInfo?, pkg: String): Boolean {
                  val p = pkg.lowercase(Locale.getDefault())
                  if (!p.contains("settings") && !isInstallerPkg(p)) return false
                  if (root == null) return false
                  return containsAppName(root)
              }

              private fun containsAppName(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val text = node.text?.toString() ?: ""
                  val desc = node.contentDescription?.toString() ?: ""
                  if (text.contains("YouTube TimeGlass", ignoreCase = true) ||
                      desc.contains("YouTube TimeGlass", ignoreCase = true) ||
                      text.contains("com.example.ytbblocker", ignoreCase = true)) {
                      return true
                  }
                  for (i in 0 until node.childCount) {
                      if (containsAppName(node.getChild(i))) return true
                  }
                  return false
              }

              private fun isYoutubeCurrentlyVisible(): Boolean {
                  try {
                      val root = rootInActiveWindow
                      if (root?.packageName != null && isYoutubePkg(root.packageName.toString())) {
                          return true
                      }
                      for (w in windows) {
                          val wPkg = w.root?.packageName?.toString() ?: continue
                          if (isYoutubePkg(wPkg)) return true
                      }
                  } catch (e: Exception) {}
                  return isYoutubePkg(lastActivePkg)
              }

              private fun getRemainingSeconds(): Int {
                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                  val savedDate = prefs.getString("LAST_DATE", "")
                  val defaultLimitSec = prefs.getInt("DAILY_LIMIT_MIN", 60) * 60

                  return if (today != savedDate) {
                      prefs.edit()
                          .putString("LAST_DATE", today)
                          .putInt("REMAINING_SEC", defaultLimitSec)
                          .putBoolean("IS_LOCKED_NOW", false)
                          .apply()
                      defaultLimitSec
                  } else {
                      prefs.getInt("REMAINING_SEC", defaultLimitSec)
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                      var rem = getRemainingSeconds()
                      val ytbVisible = isYoutubeCurrentlyVisible()

                      if (ytbVisible) {
                          if (rem <= 0) {
                              prefs.edit().putBoolean("IS_LOCKED_NOW", true).apply()
                              pauseYoutubeMedia()
                              showGlassOverlay("YTB")
                          } else {
                              rem -= 1
                              prefs.edit().putInt("REMAINING_SEC", rem).apply()
                              if (rem <= 0) {
                                  prefs.edit().putBoolean("IS_LOCKED_NOW", true).apply()
                                  pauseYoutubeMedia()
                                  showGlassOverlay("YTB")
                              }
                          }
                      } else {
                          // Nếu đã thoát hẳn YouTube và đang hiện khóa YTB thì tự ẩn khóa để dùng các app khác bình thường
                          if (isOverlayShowing && currentLockMode == "YTB" && !isYoutubePkg(lastActivePkg)) {
                              removeGlassOverlay()
                          }
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun pauseYoutubeMedia() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val downEvent = KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PAUSE)
                      val upEvent = KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PAUSE)
                      am.dispatchMediaKeyEvent(downEvent)
                      am.dispatchMediaKeyEvent(upEvent)
                  } catch (e: Exception) {}
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  handler.removeCallbacks(ticker)
                  handler.post(ticker)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg.contains("inputmethod") || pkg.contains("systemui")) return

                  if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      if (pkg != packageName) {
                          lastActivePkg = pkg
                      }
                  }

                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  val allowAdminUntil = prefs.getLong("ALLOW_ADMIN_UNTIL", 0L)

                  // 1. Chặn ngay lập tức nếu mò vào Cài đặt để tắt Accessibility hoặc bấm Gỡ cài đặt
                  if (System.currentTimeMillis() > allowAdminUntil) {
                      if (isInstallerPkg(pkg) || isTamperingWithOurApp(rootInActiveWindow, pkg)) {
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          showGlassOverlay("PROTECT")
                          return
                      }
                  }

                  // 2. Nếu mở YouTube khi đã hết giờ -> Phủ kính khóa ngay lập tức trong 0.1 giây!
                  if (isYoutubePkg(pkg)) {
                      if (getRemainingSeconds() <= 0) {
                          pauseYoutubeMedia()
                          showGlassOverlay("YTB")
                      }
                  }
              }

              private fun showGlassOverlay(mode: String) {
                  if (isOverlayShowing && currentLockMode == mode) return
                  removeGlassOverlay()
                  currentLockMode = mode

                  val wm = windowManager ?: return
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_DIM_BEHIND,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      dimAmount = 0.85f
                      gravity = Gravity.CENTER
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          blurBehindRadius = 60 // Làm mờ kính thật trên Android 12+
                      }
                  }

                  val root = FrameLayout(this).apply {
                      background = GlassUI.cosmicBackground().apply { alpha = 235 }
                      setPadding(GlassUI.dp(context, 24), GlassUI.dp(context, 24), GlassUI.dp(context, 24), GlassUI.dp(context, 24))
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = GlassUI.glassCard(context, 32)
                      val pad = GlassUI.dp(context, 32)
                      setPadding(pad, pad, pad, pad)
                      layoutParams = FrameLayout.LayoutParams(
                          GlassUI.dp(context, 420),
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                  }

                  val iconTxt = TextView(this).apply {
                      text = if (mode == "PROTECT") "🛡️" else "⏳"
                      textSize = 42f
                      gravity = Gravity.CENTER
                  }

                  val title = TextView(this).apply {
                      text = if (mode == "PROTECT") "Bảo Vệ Quản Trị Viên" else "Hết Giờ Xem YouTube"
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, GlassUI.dp(context, 10), 0, GlassUI.dp(context, 6))
                  }

                  val sub = TextView(this).apply {
                      text = if (mode == "PROTECT")
                          "Nhập mật khẩu hiện tại để gỡ cài đặt ứng dụng hoặc mở khóa quyền hệ thống:"
                      else
                          "Thời gian xem YouTube đã hết. Nhập mật khẩu quản trị ngay bên dưới để mở khóa tiếp:"
                      textSize = 14f
                      setTextColor(Color.parseColor("#CCFFFFFF"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, GlassUI.dp(context, 20))
                  }

                  val passInput = EditText(this).apply {
                      hint = "Mật khẩu quản trị"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#80FFFFFF"))
                      gravity = Gravity.CENTER
                      background = GlassUI.glassInput(context)
                      val p = GlassUI.dp(context, 14)
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = GlassUI.dp(context, 14)
                      }
                  }

                  val extraTimeInput = EditText(this).apply {
                      hint = "Số phút cấp thêm (Mặc định: 30)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("30")
                      textSize = 16f
                      setTextColor(Color.parseColor("#64D2FF"))
                      setHintTextColor(Color.parseColor("#80FFFFFF"))
                      gravity = Gravity.CENTER
                      background = GlassUI.glassInput(context)
                      val p = GlassUI.dp(context, 12)
                      setPadding(p, p, p, p)
                      visibility = if (mode == "YTB") View.VISIBLE else View.GONE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = GlassUI.dp(context, 18)
                      }
                  }

                  val btnUnlock = Button(this).apply {
                      text = if (mode == "PROTECT") "Xác Nhận & Xóa Ứng Dụng Ngay" else "Mở Khóa YouTube"
                      textSize = 15f
                      isAllCaps = false
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      background = GlassUI.glassButton(context, isAccent = (mode == "YTB"), isDanger = (mode == "PROTECT"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 50)
                      ).apply {
                          bottomMargin = GlassUI.dp(context, 10)
                      }
                      setOnClickListener {
                          val currentPass = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                          if (passInput.text.toString() == currentPass) {
                              val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                              if (mode == "YTB") {
                                  val addMins = extraTimeInput.text.toString().toIntOrNull() ?: 30
                                  prefs.edit()
                                      .putInt("REMAINING_SEC", addMins * 60)
                                      .putBoolean("IS_LOCKED_NOW", false)
                                      .apply()
                                  Toast.makeText(this@BlockerService, "Đã mở khóa thêm $addMins phút!", Toast.LENGTH_SHORT).show()
                                  removeGlassOverlay()
                              } else {
                                  // Mở khóa & Tự động gỡ quyền Admin rồi bung bảng Xóa cái 1!
                                  prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 180000).apply()
                                  removeGlassOverlay()
                                  triggerOneClickUninstall()
                              }
                          } else {
                              Toast.makeText(this@BlockerService, "Mật khẩu không chính xác!", Toast.LENGTH_SHORT).show()
                              passInput.text.clear()
                          }
                      }
                  }

                  val btnExit = Button(this).apply {
                      text = if (mode == "PROTECT") "Đóng" else "Thoát YouTube Về Màn Hình Chính"
                      textSize = 14f
                      isAllCaps = false
                      setTextColor(Color.parseColor("#E0FFFFFF"))
                      background = GlassUI.glassButton(context, isAccent = false)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 46)
                      )
                      setOnClickListener {
                          removeGlassOverlay()
                          performGlobalAction(GLOBAL_ACTION_HOME)
                      }
                  }

                  card.addView(iconTxt)
                  card.addView(title)
                  card.addView(sub)
                  card.addView(passInput)
                  card.addView(extraTimeInput)
                  card.addView(btnUnlock)
                  card.addView(btnExit)
                  root.addView(card)

                  try {
                      wm.addView(root, params)
                      overlayView = root
                      isOverlayShowing = true
                      passInput.requestFocus()
                  } catch (e: Exception) {
                      // Nếu chưa cấp quyền Overlay thì fallback đẩy về Activity khóa
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  }
              }

              private fun triggerOneClickUninstall() {
                  try {
                      val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                      val comp = ComponentName(this, AdminReceiver::class.java)
                      if (dpm.isAdminActive(comp)) {
                          dpm.removeActiveAdmin(comp)
                      }
                  } catch (e: Exception) {}

                  handler.postDelayed({
                      val uninstallIntent = Intent(Intent.ACTION_DELETE).apply {
                          data = Uri.parse("package:$packageName")
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      startActivity(uninstallIntent)
                  }, 300)
              }

              private fun removeGlassOverlay() {
                  if (overlayView != null) {
                      try {
                          windowManager?.removeView(overlayView)
                      } catch (e: Exception) {}
                      overlayView = null
                  }
                  isOverlayShowing = false
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(ticker)
                  removeGlassOverlay()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/MainActivity.kt
          package com.example.ytbblocker

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  renderGlassDashboard()
              }

              override fun onResume() {
                  super.onResume()
                  renderGlassDashboard()
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return enabled.contains(packageName)
              }

              private fun isOverlayGranted(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else true
              }

              private fun isAdminActive(): Boolean {
                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val comp = ComponentName(this, AdminReceiver::class.java)
                  return dpm.isAdminActive(comp)
              }

              private fun renderGlassDashboard() {
                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  val isLockedNow = prefs.getBoolean("IS_LOCKED_NOW", false) && prefs.getInt("REMAINING_SEC", 3600) <= 0

                  val scroll = ScrollView(this).apply {
                      background = GlassUI.cosmicBackground()
                      isFillViewport = true
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      val p = GlassUI.dp(context, 24)
                      setPadding(p, p, p, p)
                  }
                  scroll.addView(container)

                  val glassCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = GlassUI.glassCard(context, 32)
                      val pad = GlassUI.dp(context, 28)
                      setPadding(pad, pad, pad, pad)
                      layoutParams = LinearLayout.LayoutParams(
                          GlassUI.dp(context, 440),
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }
                  container.addView(glassCard)

                  // Nếu đã hết giờ xem trong ngày mà ai đó mở App Cài đặt -> Bắt nhập Pass mới cho chỉnh lại giờ!
                  if (isLockedNow) {
                      val lockHeader = TextView(this).apply {
                          text = "🔒 Đã Khóa Hết Giờ Xem"
                          textSize = 22f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                      }
                      val lockDesc = TextView(this).apply {
                          text = "Hôm nay đã hết thời gian xem YouTube. Nhập mật khẩu quản trị để vào lại bảng điều khiển:"
                          textSize = 14f
                          setTextColor(Color.parseColor("#CCFFFFFF"))
                          gravity = Gravity.CENTER
                          setPadding(0, GlassUI.dp(context, 10), 0, GlassUI.dp(context, 20))
                      }
                      val passBox = EditText(this).apply {
                          hint = "Nhập mật khẩu hiện tại"
                          inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                          textSize = 18f
                          setTextColor(Color.WHITE)
                          setHintTextColor(Color.parseColor("#80FFFFFF"))
                          gravity = Gravity.CENTER
                          background = GlassUI.glassInput(context)
                          val p = GlassUI.dp(context, 14)
                          setPadding(p, p, p, p)
                      }
                      val btnUnlockApp = Button(this).apply {
                          text = "Mở Khóa Cài Đặt"
                          isAllCaps = false
                          setTextColor(Color.WHITE)
                          setTypeface(null, Typeface.BOLD)
                          background = GlassUI.glassButton(context, isAccent = true)
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              GlassUI.dp(context, 50)
                          ).apply { topMargin = GlassUI.dp(context, 16) }
                          setOnClickListener {
                              val secret = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                              if (passBox.text.toString() == secret) {
                                  prefs.edit().putBoolean("IS_LOCKED_NOW", false).putInt("REMAINING_SEC", 1800).apply()
                                  renderGlassDashboard()
                              } else {
                                  Toast.makeText(this@MainActivity, "Sai mật khẩu!", Toast.LENGTH_SHORT).show()
                                  passBox.text.clear()
                              }
                          }
                      }
                      glassCard.addView(lockHeader)
                      glassCard.addView(lockDesc)
                      glassCard.addView(passBox)
                      glassCard.addView(btnUnlockApp)
                      setContentView(scroll)
                      return
                  }

                  // GIAO DIỆN LIQUID GLASS CHÍNH (KHÔNG CẦN NHẬP PASS ĐỂ CHỈNH GIỜ)
                  val title = TextView(this).apply {
                      text = "YouTube TimeGlass"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  val remainSec = prefs.getInt("REMAINING_SEC", 3600)
                  val dailyMin = prefs.getInt("DAILY_LIMIT_MIN", 60)

                  val subtitle = TextView(this).apply {
                      text = "Thời gian còn lại: ${remainSec / 60} phút ${remainSec % 60} giây"
                      textSize = 15f
                      setTextColor(Color.parseColor("#64D2FF"))
                      gravity = Gravity.CENTER
                      setPadding(0, GlassUI.dp(context, 6), 0, GlassUI.dp(context, 20))
                  }

                  val labelInput = TextView(this).apply {
                      text = "Số phút cho phép xem YouTube (Không cần nhập Pass):"
                      textSize = 13f
                      setTextColor(Color.parseColor("#CCFFFFFF"))
                      setPadding(0, 0, 0, GlassUI.dp(context, 8))
                  }

                  val minInput = EditText(this).apply {
                      hint = "Nhập số phút (VD: 1 hoặc 60)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(dailyMin.toString())
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#80FFFFFF"))
                      gravity = Gravity.CENTER
                      background = GlassUI.glassInput(context)
                      val p = GlassUI.dp(context, 14)
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = GlassUI.dp(context, 14) }
                  }

                  val btnSaveImmediate = Button(this).apply {
                      text = "Áp Dụng Thời Gian Ngay"
                      textSize = 16f
                      isAllCaps = false
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      background = GlassUI.glassButton(context, isAccent = true)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 52)
                      ).apply { bottomMargin = GlassUI.dp(context, 22) }
                      setOnClickListener {
                          val mins = minInput.text.toString().toIntOrNull() ?: 60
                          val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                          prefs.edit()
                              .putString("LAST_DATE", today)
                              .putInt("DAILY_LIMIT_MIN", mins)
                              .putInt("REMAINING_SEC", mins * 60)
                              .putBoolean("IS_LOCKED_NOW", mins <= 0)
                              .apply()
                          Toast.makeText(this@MainActivity, "✅ Đã đặt $mins phút xem YouTube!", Toast.LENGTH_SHORT).show()
                          renderGlassDashboard()
                      }
                  }

                  // Kiểm tra 3 quyền bảo vệ
                  val overlayOk = isOverlayGranted()
                  val accessOk = isAccessibilityEnabled()
                  val adminOk = isAdminActive()

                  val btnStep1 = Button(this).apply {
                      text = if (overlayOk) "✅ 1. Đã Cấp Quyền Phủ Kính Khóa Trên YouTube" else "⚠️ 1. Bấm Cấp Quyền Hiện Kính Khóa Trên YouTube"
                      textSize = 13f
                      isAllCaps = false
                      setTextColor(if (overlayOk) Color.parseColor("#30D158") else Color.parseColor("#FFD60A"))
                      background = GlassUI.glassButton(context, isAccent = false)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 46)
                      ).apply { bottomMargin = GlassUI.dp(context, 10) }
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          }
                      }
                  }

                  val btnStep2 = Button(this).apply {
                      text = if (accessOk) "✅ 2. Đã Bật Chặn Ngầm & Chống Tắt Quyền" else "⚠️ 2. Bấm Bật Quyền Canh Giờ (Accessibility)"
                      textSize = 13f
                      isAllCaps = false
                      setTextColor(if (accessOk) Color.parseColor("#30D158") else Color.parseColor("#FFD60A"))
                      background = GlassUI.glassButton(context, isAccent = false)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 46)
                      ).apply { bottomMargin = GlassUI.dp(context, 10) }
                      setOnClickListener {
                          prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }

                  val btnStep3 = Button(this).apply {
                      text = if (adminOk) "✅ 3. Đã Khóa Chống Xóa Lén App" else "⚠️ 3. Bấm Bật Chống Xóa App (Device Admin)"
                      textSize = 13f
                      isAllCaps = false
                      setTextColor(if (adminOk) Color.parseColor("#30D158") else Color.parseColor("#FFD60A"))
                      background = GlassUI.glassButton(context, isAccent = false)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 46)
                      ).apply { bottomMargin = GlassUI.dp(context, 18) }
                      setOnClickListener {
                          prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                          val comp = ComponentName(this@MainActivity, AdminReceiver::class.java)
                          val i = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                              putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp)
                              putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Ngăn chặn gỡ ứng dụng khi chưa nhập mật khẩu.")
                          }
                          startActivity(i)
                      }
                  }

                  // Nút Xóa App 1 Chạm có bảo vệ bằng Pass
                  val btnUninstall = Button(this).apply {
                      text = "🗑️ Gỡ Cài Đặt Ứng Dụng (Yêu cầu Pass)"
                      textSize = 14f
                      isAllCaps = false
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      background = GlassUI.glassButton(context, isAccent = false, isDanger = true)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          GlassUI.dp(context, 48)
                      )
                      setOnClickListener {
                          showUninstallPasswordDialog()
                      }
                  }

                  glassCard.addView(title)
                  glassCard.addView(subtitle)
                  glassCard.addView(labelInput)
                  glassCard.addView(minInput)
                  glassCard.addView(btnSaveImmediate)
                  glassCard.addView(btnStep1)
                  glassCard.addView(btnStep2)
                  glassCard.addView(btnStep3)
                  glassCard.addView(btnUninstall)

                  setContentView(scroll)
              }

              private fun showUninstallPasswordDialog() {
                  val input = EditText(this).apply {
                      hint = "Nhập mật khẩu hiện tại để xóa"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      gravity = Gravity.CENTER
                  }
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("Xác nhận Gỡ cài đặt")
                      .setMessage("Nhập mật khẩu hiện tại để tự động mở khóa và xóa ứng dụng ngay lập tức:")
                      .setView(input)
                      .setPositiveButton("Xóa Ngay") { _, _ ->
                          val pass = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                          if (input.text.toString() == pass) {
                              val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                              prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 180000).apply()
                              try {
                                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                                  val comp = ComponentName(this, AdminReceiver::class.java)
                                  if (dpm.isAdminActive(comp)) {
                                      dpm.removeActiveAdmin(comp)
                                  }
                              } catch (e: Exception) {}
                              val uninstallIntent = Intent(Intent.ACTION_DELETE).apply {
                                  data = Uri.parse("package:$packageName")
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              startActivity(uninstallIntent)
                          } else {
                              Toast.makeText(this, "Sai mật khẩu! Không thể xóa.", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Hủy", null)
                      .show()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeBlocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
