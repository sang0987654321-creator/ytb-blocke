name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project & Code V6 Liquid Glass
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/ytbblocker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtbBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.ytbblocker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.ytbblocker"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 6
                  versionName = "6.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="true" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <application
                  android:label="YouTube TimeGlass"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/service_config" />
                  </service>
                  <receiver
                      android:name=".AdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/AdminReceiver.kt
          package com.example.ytbblocker
          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
                  return "Yêu cầu mật khẩu quản trị để gỡ cài đặt!"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/GlassUI.kt
          package com.example.ytbblocker

          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.util.TypedValue
          import android.view.View

          object GlassUI {
              fun dp(context: Context, value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      context.resources.displayMetrics
                  ).toInt()
              }

              // Thẻ kính mờ Liquid Glass chuẩn Apple visionOS
              fun glassCard(context: Context, cornerDp: Int = 30): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          Color.parseColor("#40FFFFFF"),
                          Color.parseColor("#18FFFFFF"),
                          Color.parseColor("#28FFFFFF")
                      )
                  ).apply {
                      cornerRadius = dp(context, cornerDp).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#66FFFFFF"))
                  }
              }

              // Ô nhập liệu kính tối bên trong
              fun glassInput(context: Context): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#38000000"))
                      cornerRadius = dp(context, 18).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#45FFFFFF"))
                  }
              }

              // Nút bấm Liquid Glass phát sáng
              fun glassButton(context: Context, isAccent: Boolean = true, isDanger: Boolean = false): GradientDrawable {
                  val colors = when {
                      isDanger -> intArrayOf(Color.parseColor("#CCFF3B30"), Color.parseColor("#99D70015"))
                      isAccent -> intArrayOf(Color.parseColor("#CC0A84FF"), Color.parseColor("#990055D4"))
                      else -> intArrayOf(Color.parseColor("#35FFFFFF"), Color.parseColor("#18FFFFFF"))
                  }
                  return GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, colors).apply {
                      cornerRadius = dp(context, 20).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#80FFFFFF"))
                  }
              }

              // Nền vũ trụ sâu thẳm kiểu iOS 18
              fun cosmicBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          Color.parseColor("#0B0F29"),
                          Color.parseColor("#1A103C"),
                          Color.parseColor("#091E26")
                      )
                  )
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/BlockerService.kt
          package com.example.ytbblocker

          import android.accessibilityservice.Accessibility
