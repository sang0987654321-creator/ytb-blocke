name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (No Cache Error)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Generate Project & Code v1.13 No-Flicker Built-in Keypad
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/ytbblocker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtbBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.ytbblocker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.ytbblocker"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 13
                  versionName = "v1.13"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="150"
              android:canRetrieveWindowContent="false" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <application
                  android:label="YouTube TimeGlass v1.13"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/service_config" />
                  </service>
                  <receiver
                      android:name=".AdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/AdminReceiver.kt
          package com.example.ytbblocker
          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
                  return "Yêu cầu mật khẩu quản trị để gỡ cài đặt!"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/GlassUI.kt
          package com.example.ytbblocker

          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.util.TypedValue
          import android.view.Gravity
          import android.widget.*

          object GlassUI {
              fun dp(context: Context, value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      context.resources.displayMetrics
                  ).toInt()
              }

              fun appleLiquidGlassCard(context: Context): Drawable {
                  return object : Drawable() {
                      private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                      private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          style = Paint.Style.STROKE
                          strokeWidth = dp(context, 2).toFloat()
                      }
                      private val radius = dp(context, 34).toFloat()

                      override fun draw(canvas: Canvas) {
                          val rect = RectF(bounds)
                          if (rect.width() <= 0 || rect.height() <= 0) return
                          val inset = borderPaint.strokeWidth / 2f
                          rect.inset(inset, inset)

                          paint.shader = LinearGradient(
                              0f, 0f, rect.width(), rect.height(),
                              intArrayOf(
                                  Color.parseColor("#F5F6F9FC"),
                                  Color.parseColor("#EDEFF5FA"),
                                  Color.parseColor("#F5F6F9FC")
                              ),
                              floatArrayOf(0f, 0.5f, 1f),
                              Shader.TileMode.CLAMP
                          )
                          canvas.drawRoundRect(rect, radius, radius, paint)

                          val rainbowShader = LinearGradient(
                              0f, 0f, rect.width(), rect.height(),
                              intArrayOf(
                                  Color.parseColor("#22FF3B30"),
                                  Color.parseColor("#20FFCC00"),
                                  Color.parseColor("#2034C759"),
                                  Color.parseColor("#22007AFF"),
                                  Color.parseColor("#20AF52DE")
                              ),
                              floatArrayOf(0f, 0.25f, 0.5f, 0.75f, 1f),
                              Shader.TileMode.CLAMP
                          )
                          paint.shader = rainbowShader
                          canvas.drawRoundRect(rect, radius, radius, paint)

                          borderPaint.shader = LinearGradient(
                              0f, 0f, rect.width(), rect.height(),
                              intArrayOf(
                                  Color.parseColor("#FFFFFFFF"),
                                  Color.parseColor("#88A0C8FF"),
                                  Color.parseColor("#88FFB6C1"),
                                  Color.parseColor("#EEFFFFFF")
                              ),
                              floatArrayOf(0f, 0.35f, 0.7f, 1f),
                              Shader.TileMode.CLAMP
                          )
                          canvas.drawRoundRect(rect, radius, radius, borderPaint)
                      }

                      override fun setAlpha(alpha: Int) {}
                      override fun setColorFilter(colorFilter: ColorFilter?) {}
                      override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
                  }
              }

              fun cosmicBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          Color.parseColor("#0B0F29"),
                          Color.parseColor("#1A103C"),
                          Color.parseColor("#091E26")
                      )
                  )
              }

              fun innerContentBox(context: Context): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#F2FFFFFF"))
                      cornerRadius = dp(context, 20).toFloat()
                      setStroke(dp(context, 1), Color.parseColor("#1F000000"))
                  }
              }

              fun cleanInputBox(context: Context): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#18767680"))
                      cornerRadius = dp(context, 14).toFloat()
                  }
              }

              fun numpadKeyBg(context: Context): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#24787880"))
                      cornerRadius = dp(context, 12).toFloat()
                  }
              }

              fun grayPillButton(context: Context): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor("#38787880"))
                      cornerRadius = dp(context, 50).toFloat()
                  }
              }

              fun bluePillButton(context: Context, isRed: Boolean = false): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(if (isRed) Color.parseColor("#FF3B30") else Color.parseColor("#007AFF"))
                      cornerRadius = dp(context, 50).toFloat()
                  }
              }

              // Bàn phím số nội bộ: KHÔNG BAO GIỜ GỌI BÀN PHÍM HỆ THỐNG -> 0% GIỰT MÀN HÌNH!
              fun buildPinPadView(context: Context, onPinChanged: (String) -> Unit): Pair<LinearLayout, () -> Unit> {
                  var currentPin = ""
                  val wrapper = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }

                  // Ô hiển thị mật khẩu (dùng TextView thay vì EditText để cấm bàn phím hệ thống nhảy lên)
                  val displayBox = TextView(context).apply {
                      text = "Nhập mật khẩu"
                      textSize = 17f
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.parseColor("#8E8E93"))
                      gravity = Gravity.CENTER
                      background = cleanInputBox(context)
                      val p = dp(context, 12)
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dp(context, 10) }
                  }
                  wrapper.addView(displayBox)

                  fun updateDisplay() {
                      if (currentPin.isEmpty()) {
                          displayBox.text = "Nhập mật khẩu"
                          displayBox.setTextColor(Color.parseColor("#8E8E93"))
                      } else {
                          displayBox.text = "● ".repeat(currentPin.length).trim()
                          displayBox.setTextColor(Color.parseColor("#111111"))
                      }
                      onPinChanged(currentPin)
                  }

                  val rows = listOf(
                      listOf("1", "2", "3", "4"),
                      listOf("5", "6", "7", "8"),
                      listOf("9", "0", "Xóa", "Xóa hết")
                  )

                  for (r in rows) {
                      val rowLayout = LinearLayout(context).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { bottomMargin = dp(context, 6) }
                      }
                      for (key in r) {
                          val btn = Button(context).apply {
                              text = key
                              textSize = if (key.length > 1) 12f else 17f
                              isAllCaps = false
                              setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                              setTextColor(Color.parseColor("#1C1C1E"))
                              background = numpadKeyBg(context)
                              layoutParams = LinearLayout.LayoutParams(0, dp(context, 42), 1f).apply {
                                  setMargins(dp(context, 3), 0, dp(context, 3), 0)
                              }
                              setOnClickListener {
                                  when (key) {
                                      "Xóa" -> if (currentPin.isNotEmpty()) currentPin = currentPin.dropLast(1)
                                      "Xóa hết" -> currentPin = ""
                                      else -> if (currentPin.length < 8) currentPin += key
                                  }
                                  updateDisplay()
                              }
                          }
                          rowLayout.addView(btn)
                      }
                      wrapper.addView(rowLayout)
                  }

                  val clearFn = {
                      currentPin = ""
                      updateDisplay()
                  }
                  return Pair(wrapper, clearFn)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/BlockerService.kt
          package com.example.ytbblocker

          import android.accessibilityservice.AccessibilityService
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class BlockerService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var isOverlayShowing = false

              // Quản lý đếm giờ bằng mốc thời gian thực (Không chạy vòng lặp, chính xác từng mili-giây)
              private var isYoutubeSessionActive = false
              private var sessionStartMarkMs = 0L

              // Rào chắn chỉ nổ đúng 1 lần khi hết thời gian cho phép
              private val exactExpireAlarm = Runnable {
                  if (isYoutubeSessionActive) {
                      commitElapsedYoutubeTime()
                      isYoutubeSessionActive = false
                      val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                      prefs.edit().putLong("REMAINING_MS", 0L).putBoolean("IS_LOCKED_NOW", true).apply()
                      pauseYoutubeMedia()
                      showRockSolidOverlay("YTB")
                  }
              }

              private fun isYoutubePkg(pkg: String): Boolean {
                  val p = pkg.lowercase(Locale.getDefault())
                  if (p == packageName.lowercase(Locale.getDefault())) return false
                  return p.contains("youtube") || p.contains("smarttube") ||
                         p.contains("vanced") || p.contains("revanced") ||
                         p.contains("newpipe") || p.contains("tubular")
              }

              private fun isIgnoredSystemOverlay(pkg: String): Boolean {
                  val p = pkg.lowercase(Locale.getDefault())
                  return p == packageName.lowercase(Locale.getDefault()) ||
                         p.contains("systemui") ||
                         p.contains("inputmethod") ||
                         p.contains("keyboard") ||
                         p.contains("volume")
              }

              private fun isInstallerPkg(pkg: String): Boolean {
                  val p = pkg.lowercase(Locale.getDefault())
                  return p.contains("packageinstaller") || p.contains("permissioncontroller") || p.contains("uninstaller")
              }

              private fun getRemainingMillis(): Long {
                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                  val savedDate = prefs.getString("LAST_DATE", "")
                  val defaultLimitMs = prefs.getInt("DAILY_LIMIT_MIN", 60) * 60_000L

                  return if (today != savedDate) {
                      prefs.edit()
                          .putString("LAST_DATE", today)
                          .putLong("REMAINING_MS", defaultLimitMs)
                          .putBoolean("IS_LOCKED_NOW", false)
                          .apply()
                      defaultLimitMs
                  } else {
                      prefs.getLong("REMAINING_MS", defaultLimitMs)
                  }
              }

              private fun startYoutubeCountdownIfNeeded() {
                  val remMs = getRemainingMillis()
                  if (remMs <= 0L) {
                      isYoutubeSessionActive = false
                      handler.removeCallbacks(exactExpireAlarm)
                      pauseYoutubeMedia()
                      showRockSolidOverlay("YTB")
                      return
                  }
                  // Nếu đang đếm giờ trong YouTube rồi thì giữ nguyên, không trừ lố khi chuyển tab trong YouTube!
                  if (isYoutubeSessionActive) return

                  isYoutubeSessionActive = true
                  sessionStartMarkMs = System.currentTimeMillis()
                  handler.removeCallbacks(exactExpireAlarm)
                  handler.postDelayed(exactExpireAlarm, remMs)
              }

              private fun commitElapsedYoutubeTime() {
                  if (!isYoutubeSessionActive) return
                  handler.removeCallbacks(exactExpireAlarm)
                  val now = System.currentTimeMillis()
                  val elapsed = (now - sessionStartMarkMs).coerceAtLeast(0L)
                  val currentRem = getRemainingMillis()
                  val newRem = (currentRem - elapsed).coerceAtLeast(0L)
                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  prefs.edit()
                      .putLong("REMAINING_MS", newRem)
                      .putBoolean("IS_LOCKED_NOW", newRem <= 0L)
                      .apply()
                  isYoutubeSessionActive = false
              }

              private fun pauseYoutubeMedia() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PAUSE))
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PAUSE))
                  } catch (e: Exception) {}
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  try {
                      if (isOverlayShowing) return
                      if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                      val pkg = event.packageName?.toString() ?: return

                      // Bỏ qua thanh âm lượng / thông báo để không ngắt quãng phiên đếm giờ YouTube
                      if (isIgnoredSystemOverlay(pkg)) return

                      val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                      val allowAdminUntil = prefs.getLong("ALLOW_ADMIN_UNTIL", 0L)

                      // 1. Chặn gỡ cài đặt khi chưa mở khóa
                      if (System.currentTimeMillis() > allowAdminUntil && isInstallerPkg(pkg)) {
                          commitElapsedYoutubeTime()
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          showRockSolidOverlay("PROTECT")
                          return
                      }

                      // 2. Xử lý chuẩn xác phiên mở / thoát YouTube
                      if (isYoutubePkg(pkg)) {
                          startYoutubeCountdownIfNeeded()
                      } else {
                          // Khi người dùng thực sự thoát YouTube ra màn hình chính hoặc sang app khác -> Lưu số giây đã xem
                          commitElapsedYoutubeTime()
                      }
                  } catch (e: Exception) {}
              }

              private fun showRockSolidOverlay(mode: String) {
                  if (isOverlayShowing) return

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      return
                  }

                  val wm = windowManager ?: return
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  // CỜ CHỐNG GIỰT TUYỆT ĐỐI: FLAG_NOT_FOCUSABLE + FLAG_ALT_FOCUSABLE_IM cấm hệ thống gọi bàn phím ảo!
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_ALT_FOCUSABLE_IM,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#99000000"))
                      val p = GlassUI.dp(context, 18)
                      setPadding(p, p, p, p)
                      isClickable = true
                  }

                  val dialogCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GlassUI.appleLiquidGlassCard(context)
                      val padH = GlassUI.dp(context, 22)
                      val padV = GlassUI.dp(context, 24)
                      setPadding(padH, padV, padH, padV)
                      layoutParams = FrameLayout.LayoutParams(
                          GlassUI.dp(context, 360),
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                  }

                  // DÒNG 1: "Đã hết thời gian xem YouTube"
                  val title = TextView(this).apply {
                      text = if (mode == "PROTECT")
                          "Yêu Cầu Mật Khẩu Để Xóa App"
                      else
                          "Đã hết thời gian xem YouTube"
                      textSize = 19f
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.parseColor("#111111"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, GlassUI.dp(context, 14))
                  }

                  // DÒNG 2: Ô nhập mật khẩu + Phím bấm nội bộ (Không bao giờ giựt màn hình)
                  val centerBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GlassUI.innerContentBox(context)
                      val p = GlassUI.dp(context, 12)
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = GlassUI.dp(context, 16)
                      }
                  }

                  var enteredPin = ""
                  val (pinPadView, clearPinPad) = GlassUI.buildPinPadView(this) { pin ->
                      enteredPin = pin
                  }
                  centerBox.addView(pinPadView)

                  // DÒNG 3: Hai nút "Tiếp tục xem" và "Không xem nữa"
                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val btnContinueWatching = Button(this).apply {
                      text = if (mode == "PROTECT") "Xóa Ngay" else "Tiếp tục xem"
                      textSize = 14f
                      isAllCaps = false
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      background = GlassUI.bluePillButton(context, isRed = (mode == "PROTECT"))
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          GlassUI.dp(context, 46),
                          1f
                      ).apply {
                          rightMargin = GlassUI.dp(context, 6)
                      }
                      setOnClickListener {
                          val currentPass = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                          if (enteredPin == currentPass) {
                              val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                              if (mode == "YTB") {
                                  val configuredMins = prefs.getInt("DAILY_LIMIT_MIN", 60).let { if (it <= 0) 30 else it }
                                  val newQuotaMs = configuredMins * 60_000L
                                  val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                                  prefs.edit()
                                      .putString("LAST_DATE", today)
                                      .putLong("REMAINING_MS", newQuotaMs)
                                      .putBoolean("IS_LOCKED_NOW", false)
                                      .apply()
                                  removeGlassOverlay()
                                  // Bắt đầu đếm phiên mới ngay khi bấm Tiếp tục xem
                                  startYoutubeCountdownIfNeeded()
                                  Toast.makeText(this@BlockerService, "Đã mở khóa thêm $configuredMins phút!", Toast.LENGTH_SHORT).show()
                              } else {
                                  prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 180000).apply()
                                  removeGlassOverlay()
                                  triggerOneClickUninstall()
                              }
                          } else {
                              Toast.makeText(this@BlockerService, "Sai mật khẩu!", Toast.LENGTH_SHORT).show()
                              clearPinPad()
                          }
                      }
                  }

                  val btnStopWatching = Button(this).apply {
                      text = if (mode == "PROTECT") "Hủy bỏ" else "Không xem nữa"
                      textSize = 14f
                      isAllCaps = false
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.parseColor("#1C1C1E"))
                      background = GlassUI.grayPillButton(context)
                      layoutParams = LinearLayout.LayoutParams(
                          0,
                          GlassUI.dp(context, 46),
                          1f
                      ).apply {
                          leftMargin = GlassUI.dp(context, 6)
                      }
                      setOnClickListener {
                          isYoutubeSessionActive = false
                          performGlobalAction(GLOBAL_ACTION_HOME)
                          handler.postDelayed({
                              removeGlassOverlay()
                          }, 300)
                      }
                  }

                  btnRow.addView(btnContinueWatching)
                  btnRow.addView(btnStopWatching)

                  dialogCard.addView(title)
                  dialogCard.addView(centerBox)
                  dialogCard.addView(btnRow)
                  root.addView(dialogCard)

                  try {
                      wm.addView(root, params)
                      overlayView = root
                      isOverlayShowing = true
                  } catch (e: Exception) {
                      isOverlayShowing = false
                  }
              }

              private fun triggerOneClickUninstall() {
                  try {
                      val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                      val comp = ComponentName(this, AdminReceiver::class.java)
                      if (dpm.isAdminActive(comp)) {
                          dpm.removeActiveAdmin(comp)
                      }
                  } catch (e: Exception) {}

                  handler.postDelayed({
                      try {
                          val uninstallIntent = Intent(Intent.ACTION_DELETE).apply {
                              data = Uri.parse("package:$packageName")
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          startActivity(uninstallIntent)
                      } catch (e: Exception) {}
                  }, 300)
              }

              private fun removeGlassOverlay() {
                  if (overlayView != null) {
                      try {
                          windowManager?.removeViewImmediate(overlayView)
                      } catch (e: Exception) {}
                      overlayView = null
                  }
                  isOverlayShowing = false
              }

              override fun onInterrupt() {
                  commitElapsedYoutubeTime()
                  removeGlassOverlay()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/MainActivity.kt
          package com.example.ytbblocker

          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  renderMainDashboard()
              }

              override fun onResume() {
                  super.onResume()
                  renderMainDashboard()
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return enabled.contains(packageName)
              }

              private fun isOverlayGranted(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else true
              }

              private fun isAdminActive(): Boolean {
                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val comp = ComponentName(this, AdminReceiver::class.java)
                  return dpm.isAdminActive(comp)
              }

              private fun renderMainDashboard(showUninstallMode: Boolean = false) {
                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  val remMs = prefs.getLong("REMAINING_MS", 3600_000L)
                  val isLockedNow = prefs.getBoolean("IS_LOCKED_NOW", false) && remMs <= 0L

                  val scroll = ScrollView(this).apply {
                      background = GlassUI.cosmicBackground()
                      isFillViewport = true
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      val p = GlassUI.dp(context, 18)
                      setPadding(p, p, p, p)
                  }
                  scroll.addView(container)

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GlassUI.appleLiquidGlassCard(context)
                      val padH = GlassUI.dp(context, 22)
                      val padV = GlassUI.dp(context, 24)
                      setPadding(padH, padV, padH, padV)
                      layoutParams = LinearLayout.LayoutParams(
                          GlassUI.dp(context, 370),
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }
                  container.addView(card)

                  if (showUninstallMode || isLockedNow) {
                      val header = TextView(this).apply {
                          text = if (showUninstallMode)
                              "Yêu Cầu Xóa App (v1.13)"
                          else
                              "Đã hết thời gian xem YouTube"
                          textSize = 19f
                          setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                          setTextColor(Color.parseColor("#111111"))
                          gravity = Gravity.CENTER
                          setPadding(0, 0, 0, GlassUI.dp(context, 14))
                      }

                      val innerBox = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GlassUI.innerContentBox(context)
                          val p = GlassUI.dp(context, 12)
                          setPadding(p, p, p, p)
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { bottomMargin = GlassUI.dp(context, 16) }
                      }

                      var enteredPin = ""
                      val (pinPadView, clearPinPad) = GlassUI.buildPinPadView(this) { pin ->
                          enteredPin = pin
                      }
                      innerBox.addView(pinPadView)

                      val btnRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                      }

                      val btnRight = Button(this).apply {
                          text = if (showUninstallMode) "Xóa Ngay" else "Tiếp tục xem"
                          textSize = 14f
                          isAllCaps = false
                          setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          background = GlassUI.bluePillButton(context, isRed = showUninstallMode)
                          layoutParams = LinearLayout.LayoutParams(0, GlassUI.dp(context, 46), 1f).apply {
                              rightMargin = GlassUI.dp(context, 6)
                          }
                          setOnClickListener {
                              val secret = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                              if (enteredPin == secret) {
                                  if (showUninstallMode) {
                                      prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 180000).apply()
                                      try {
                                          val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                                          val comp = ComponentName(this@MainActivity, AdminReceiver::class.java)
                                          if (dpm.isAdminActive(comp)) dpm.removeActiveAdmin(comp)
                                      } catch (e: Exception) {}
                                      startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:$packageName")))
                                  } else {
                                      val mins = prefs.getInt("DAILY_LIMIT_MIN", 60).let { if (it <= 0) 30 else it }
                                      prefs.edit()
                                          .putBoolean("IS_LOCKED_NOW", false)
                                          .putLong("REMAINING_MS", mins * 60_000L)
                                          .apply()
                                      renderMainDashboard(false)
                                  }
                              } else {
                                  Toast.makeText(this@MainActivity, "Sai mật khẩu!", Toast.LENGTH_SHORT).show()
                                  clearPinPad()
                              }
                          }
                      }

                      val btnLeft = Button(this).apply {
                          text = if (showUninstallMode) "Hủy bỏ" else "Không xem nữa"
                          textSize = 14f
                          isAllCaps = false
                          setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                          setTextColor(Color.parseColor("#1C1C1E"))
                          background = GlassUI.grayPillButton(context)
                          layoutParams = LinearLayout.LayoutParams(0, GlassUI.dp(context, 46), 1f).apply {
                              leftMargin = GlassUI.dp(context, 6)
                          }
                          setOnClickListener {
                              if (showUninstallMode) renderMainDashboard(false) else finish()
                          }
                      }

                      btnRow.addView(btnRight)
                      btnRow.addView(btnLeft)

                      card.addView(header)
                      card.addView(innerBox)
                      card.addView(btnRow)
                      setContentView(scroll)
                      return
                  }

                  // BẢNG CÀI ĐẶT CHÍNH (v1.13)
                  val dailyMin = prefs.getInt("DAILY_LIMIT_MIN", 60)
                  val remainSecTotal = (remMs / 1000L).toInt()

                  val title = TextView(this).apply {
                      text = "YouTube TimeGlass (v1.13)"
                      textSize = 20f
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.parseColor("#111111"))
                  }

                  val desc = TextView(this).apply {
                      text = "Thời gian còn lại: ${remainSecTotal / 60} phút ${remainSecTotal % 60} giây\nĐặt số phút xem YouTube (Không cần mật khẩu):"
                      textSize = 13f
                      setTextColor(Color.parseColor("#2C2C2E"))
                      setPadding(0, GlassUI.dp(context, 6), 0, GlassUI.dp(context, 14))
                  }

                  val centerCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GlassUI.innerContentBox(context)
                      val p = GlassUI.dp(context, 14)
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = GlassUI.dp(context, 18) }
                  }

                  val minInput = EditText(this).apply {
                      hint = "Số phút xem (VD: 1 hoặc 60)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(dailyMin.toString())
                      textSize = 18f
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.parseColor("#007AFF"))
                      setHintTextColor(Color.parseColor("#8E8E93"))
                      gravity = Gravity.CENTER
                      background = GlassUI.cleanInputBox(context)
                      val p = GlassUI.dp(context, 10)
                      setPadding(p, p, p, p)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = GlassUI.dp(context, 10) }
                  }

                  val overlayOk = isOverlayGranted()
                  val accessOk = isAccessibilityEnabled()
                  val adminOk = isAdminActive()

                  fun makePermRow(label: String, isOk: Boolean, onClick: () -> Unit): TextView {
                      return TextView(this).apply {
                          text = if (isOk) "●  $label: Đã bật" else "○  $label: Bấm để bật"
                          textSize = 13f
                          setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                          setTextColor(if (isOk) Color.parseColor("#248A3D") else Color.parseColor("#D70015"))
                          setPadding(GlassUI.dp(context, 6), GlassUI.dp(context, 6), GlassUI.dp(context, 6), GlassUI.dp(context, 6))
                          setOnClickListener { onClick() }
                      }
                  }

                  centerCard.addView(minInput)
                  centerCard.addView(makePermRow("1. Quyền Phủ Kính Khóa (Overlay)", overlayOk) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  })
                  centerCard.addView(makePermRow("2. Quyền Canh Giờ Ngầm (Accessibility)", accessOk) {
                      prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  centerCard.addView(makePermRow("3. Khóa Chống Xóa Lén (Device Admin)", adminOk) {
                      prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                      val comp = ComponentName(this@MainActivity, AdminReceiver::class.java)
                      val i = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                          putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp)
                      }
                      startActivity(i)
                  })

                  val bottomRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val btnDeleteApp = Button(this).apply {
                      text = "Xóa App"
                      textSize = 15f
                      isAllCaps = false
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.parseColor("#1C1C1E"))
                      background = GlassUI.grayPillButton(context)
                      layoutParams = LinearLayout.LayoutParams(0, GlassUI.dp(context, 48), 1f).apply {
                          rightMargin = GlassUI.dp(context, 8)
                      }
                      setOnClickListener {
                          renderMainDashboard(showUninstallMode = true)
                      }
                  }

                  val btnAllowSave = Button(this).apply {
                      text = "Lưu Giờ"
                      textSize = 15f
                      isAllCaps = false
                      setTypeface(Typeface.SANS_SERIF, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      background = GlassUI.bluePillButton(context)
                      layoutParams = LinearLayout.LayoutParams(0, GlassUI.dp(context, 48), 1f).apply {
                          leftMargin = GlassUI.dp(context, 8)
                      }
                      setOnClickListener {
                          val mins = minInput.text.toString().toIntOrNull() ?: 60
                          val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                          prefs.edit()
                              .putString("LAST_DATE", today)
                              .putInt("DAILY_LIMIT_MIN", mins)
                              .putLong("REMAINING_MS", mins * 60_000L)
                              .putBoolean("IS_LOCKED_NOW", mins <= 0)
                              .apply()
                          Toast.makeText(this@MainActivity, "Đã đặt $mins phút xem YouTube!", Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  }

                  bottomRow.addView(btnDeleteApp)
                  bottomRow.addView(btnAllowSave)

                  card.addView(title)
                  card.addView(desc)
                  card.addView(centerCard)
                  card.addView(bottomRow)

                  setContentView(scroll)
              }
          }
