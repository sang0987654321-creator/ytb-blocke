name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project & Code Directly on Server
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/ytbblocker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YtbBlocker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.ytbblocker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.ytbblocker"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Quản Lý YouTube"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlockerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/service_config" />
                  </service>
                  <receiver
                      android:name=".AdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/AdminReceiver.kt
          package com.example.ytbblocker
          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onEnabled(context: Context, intent: Intent) {
                  Toast.makeText(context, "Đã bật Bảo vệ chống xóa ứng dụng!", Toast.LENGTH_SHORT).show()
              }
              override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
                  return "CẢNH BÁO: Ứng dụng đang được bảo vệ bởi Quản trị viên!"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/BlockerService.kt
          package com.example.ytbblocker

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import java.text.SimpleDateFormat
          import java.util.*

          class BlockerService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var isYoutubeOpen = false

              // Tất cả các bản YouTube trên TV Box và Điện thoại
              private val youtubePackages = setOf(
                  "com.google.android.youtube.tv",
                  "com.google.android.youtube.tvkids",
                  "com.google.android.youtube",
                  "com.liskovsoft.smarttubetv.beta",
                  "com.liskovsoft.smarttubetv",
                  "com.smarttube.stable",
                  "org.polymorphicshade.tubular",
                  "org.schabi.newpipe"
              )

              // Chặn trình gỡ cài đặt app
              private val installerPackages = setOf(
                  "com.android.packageinstaller",
                  "com.google.android.packageinstaller",
                  "com.android.permissioncontroller"
              )

              private val timerRunnable = object : Runnable {
                  override fun run() {
                      if (isYoutubeOpen) {
                          val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                          val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                          val savedDate = prefs.getString("LAST_DATE", "")
                          
                          val defaultLimitSeconds = prefs.getInt("DAILY_LIMIT_MIN", 60) * 60
                          var remainingSeconds = if (today != savedDate) {
                              prefs.edit().putString("LAST_DATE", today).putInt("REMAINING_SEC", defaultLimitSeconds).apply()
                              defaultLimitSeconds
                          } else {
                              prefs.getInt("REMAINING_SEC", defaultLimitSeconds)
                          }

                          if (remainingSeconds <= 0) {
                              showLockScreen("YTB_LOCK")
                          } else {
                              remainingSeconds -= 5
                              prefs.edit().putInt("REMAINING_SEC", remainingSeconds).apply()
                          }
                      }
                      handler.postDelayed(this, 5000)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  handler.post(timerRunnable)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: return
                      if (pkg == this.packageName || pkg.contains("inputmethod")) return

                      val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)

                      // 1. Nếu ai đó vào gỡ cài đặt app -> Chặn ngay!
                      val allowAdminUntil = prefs.getLong("ALLOW_ADMIN_UNTIL", 0L)
                      if (installerPackages.contains(pkg) && System.currentTimeMillis() > allowAdminUntil) {
                          showLockScreen("UNINSTALL_LOCK")
                          return
                      }

                      // 2. Nếu mở YouTube mà hết giờ -> Nhảy màn hình khóa đè lên YouTube!
                      isYoutubeOpen = youtubePackages.contains(pkg)
                      if (isYoutubeOpen) {
                          val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                          val savedDate = prefs.getString("LAST_DATE", "")
                          val defaultLimitSeconds = prefs.getInt("DAILY_LIMIT_MIN", 60) * 60
                          val remainingSeconds = if (today != savedDate) {
                              prefs.edit().putString("LAST_DATE", today).putInt("REMAINING_SEC", defaultLimitSeconds).apply()
                              defaultLimitSeconds
                          } else {
                              prefs.getInt("REMAINING_SEC", defaultLimitSeconds)
                          }

                          if (remainingSeconds <= 0) {
                              showLockScreen("YTB_LOCK")
                          }
                      }
                  }
              }

              private fun showLockScreen(mode: String) {
                  val lockIntent = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      putExtra("MODE", mode)
                  }
                  startActivity(lockIntent)
              }

              override fun onInterrupt() {
                  handler.removeCallbacks(timerRunnable)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/ytbblocker/MainActivity.kt
          package com.example.ytbblocker

          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  renderUI(intent)
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  renderUI(intent)
              }

              private fun renderUI(currentIntent: Intent?) {
                  val prefs = getSharedPreferences("YTB_PREFS", Context.MODE_PRIVATE)
                  val mode = currentIntent?.getStringExtra("MODE") ?: "SETTINGS"

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(60, 40, 60, 40)
                      setBackgroundColor(Color.parseColor("#101010"))
                  }

                  // TRƯỜNG HỢP 1: MÀN HÌNH CHẶN KHI HẾT GIỜ YOUTUBE HOẶC ĐỊNH XÓA APP
                  if (mode == "YTB_LOCK" || mode == "UNINSTALL_LOCK") {
                      val lockTitle = TextView(this).apply {
                          text = if (mode == "UNINSTALL_LOCK") "CHỨC NĂNG NÀY ĐÃ BỊ KHÓA!" else "ĐÃ HẾT THỜI GIAN XEM YOUTUBE HÔM NAY!"
                          textSize = 24f
                          setTextColor(Color.parseColor("#FF5252"))
                          gravity = Gravity.CENTER
                      }

                      val lockSub = TextView(this).apply {
                          text = if (mode == "UNINSTALL_LOCK") 
                              "Bạn không có quyền gỡ cài đặt hoặc thay đổi quyền hệ thống." 
                          else 
                              "Vui lòng tắt TV nghỉ ngơi hoặc nhập mã PIN quản trị để cấp thêm giờ xem:"
                          textSize = 16f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setPadding(0, 20, 0, 30)
                      }

                      val pinInput = EditText(this).apply {
                          hint = "Nhập mã PIN quản trị"
                          inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                          textSize = 20f
                          setTextColor(Color.WHITE)
                          setHintTextColor(Color.GRAY)
                          gravity = Gravity.CENTER
                          width = 500
                      }

                      val extraMinInput = EditText(this).apply {
                          hint = "Số phút cấp thêm (Mặc định: 30)"
                          inputType = InputType.TYPE_CLASS_NUMBER
                          setText("30")
                          textSize = 18f
                          setTextColor(Color.YELLOW)
                          gravity = Gravity.CENTER
                          width = 500
                          visibility = if (mode == "YTB_LOCK") View.VISIBLE else View.GONE
                      }

                      val btnUnlock = Button(this).apply {
                          text = "MỞ KHÓA"
                          setOnClickListener {
                              val secretPass = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                              if (pinInput.text.toString() == secretPass) {
                                  if (mode == "YTB_LOCK") {
                                      val addMins = extraMinInput.text.toString().toIntOrNull() ?: 30
                                      prefs.edit().putInt("REMAINING_SEC", addMins * 60).apply()
                                      Toast.makeText(this@MainActivity, "Đã mở khóa thêm $addMins phút!", Toast.LENGTH_LONG).show()
                                  } else {
                                      prefs.edit().putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000).apply()
                                      Toast.makeText(this@MainActivity, "Đã mở khóa quyền Gỡ cài đặt trong 2 phút!", Toast.LENGTH_LONG).show()
                                  }
                                  finish()
                              } else {
                                  Toast.makeText(this@MainActivity, "Mã PIN không chính xác!", Toast.LENGTH_SHORT).show()
                                  pinInput.text.clear()
                              }
                          }
                      }

                      val btnExitHome = Button(this).apply {
                          text = "THOÁT RA MÀN HÌNH CHÍNH"
                          setOnClickListener {
                              goHome()
                          }
                      }

                      layout.addView(lockTitle)
                      layout.addView(lockSub)
                      layout.addView(pinInput)
                      layout.addView(extraMinInput)
                      layout.addView(btnUnlock)
                      layout.addView(btnExitHome)
                      setContentView(layout)
                      pinInput.requestFocus()
                      return
                  }

                  // TRƯỜNG HỢP 2: BẢNG CÀI ĐẶT DÀNH CHO BẠN (Khi chủ động mở app "Quản Lý YouTube")
                  val remainMin = prefs.getInt("REMAINING_SEC", 3600) / 60
                  val dailyLimit = prefs.getInt("DAILY_LIMIT_MIN", 60)

                  val title = TextView(this).apply {
                      text = "CÀI ĐẶT GIỚI HẠN YOUTUBE"
                      textSize = 22f
                      setTextColor(Color.parseColor("#4CAF50"))
                      gravity = Gravity.CENTER
                  }

                  val statusText = TextView(this).apply {
                      text = "Giới hạn mỗi ngày: $dailyLimit phút | Hôm nay còn: $remainMin phút"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 15, 0, 25)
                  }

                  val timeInput = EditText(this).apply {
                      hint = "Nhập tổng số phút cho xem mỗi ngày"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(dailyLimit.toString())
                      textSize = 18f
                      setTextColor(Color.YELLOW)
                      setHintTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      width = 520
                  }

                  val pinInput = EditText(this).apply {
                      hint = "Nhập mã PIN quản trị để lưu"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      width = 520
                  }

                  val btnSave = Button(this).apply {
                      text = "LƯU CÀI ĐẶT GIỜ XEM"
                      setOnClickListener {
                          val secretPass = SimpleDateFormat("HHmmddMM", Locale.getDefault()).format(Date())
                          if (pinInput.text.toString() == secretPass) {
                              val mins = timeInput.text.toString().toIntOrNull() ?: 60
                              val today = SimpleDateFormat("ddMMyyyy", Locale.getDefault()).format(Date())
                              prefs.edit()
                                  .putString("LAST_DATE", today)
                                  .putInt("DAILY_LIMIT_MIN", mins)
                                  .putInt("REMAINING_SEC", mins * 60)
                                  .putLong("ALLOW_ADMIN_UNTIL", System.currentTimeMillis() + 120000)
                                  .apply()
                              Toast.makeText(this@MainActivity, "Đã lưu! Cho phép xem YouTube $mins phút/ngày.", Toast.LENGTH_LONG).show()
                              finish()
                          } else {
                              Toast.makeText(this@MainActivity, "Sai mã PIN quản trị!", Toast.LENGTH_SHORT).show()
                              pinInput.text.clear()
                          }
                      }
                  }

                  val btnAdmin = Button(this).apply {
                      text = "Kích hoạt Chống Xóa Ứng Dụng (Bước 1)"
                      setOnClickListener {
                          val comp = ComponentName(this@MainActivity, AdminReceiver::class.java)
                          val i = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).apply {
                              putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, comp)
                              putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Bảo vệ ứng dụng không bị gỡ cài đặt.")
                          }
                          startActivity(i)
                      }
                  }

                  val btnAccess = Button(this).apply {
                      text = "Kích hoạt Chặn YouTube Ngầm (Bước 2)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }

                  layout.addView(title)
                  layout.addView(statusText)
                  layout.addView(timeInput)
                  layout.addView(pinInput)
                  layout.addView(btnSave)
                  layout.addView(btnAdmin)
                  layout.addView(btnAccess)

                  setContentView(layout)
                  pinInput.requestFocus()
              }

              private fun goHome() {
                  val home = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  }
                  startActivity(home)
              }

              override fun onBackPressed() {
                  goHome()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeBlocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
